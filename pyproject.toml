[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openbenchmarks-inference"
version = "0.1.0"
description = "Reproducible inference-provider benchmark runners from OpenBenchmarks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "tiktoken>=0.9,<1",
  "urllib3>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1"]

[project.scripts]
openbench-inference = "openbenchmarks_inference.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openbenchmarks_inference"]

[tool.hatch.build]
include = [
  "src/openbenchmarks_inference/**/*.py",
  "src/openbenchmarks_inference/**/*.md",
  "src/openbenchmarks_inference/**/*.yaml",
  "src/openbenchmarks_inference/**/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
