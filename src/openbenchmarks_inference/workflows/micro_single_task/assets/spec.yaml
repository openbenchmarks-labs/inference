runner:
  local_run_root: runs/micro-single-task
  commands:
    smoke: openbench-inference smoke --workflow micro-single-task
    run: openbench-inference run --workflow micro-single-task --full
    watch: openbench-inference watch --workflow micro-single-task

benchmark:
  slug: inference-micro-single-task
  name: Inference Micro Single-Task Benchmark
  status: draft
  objectives:
    - Which provider makes a single user wait the least for the first visible answer token?
    - Compare GLM 5.3 Flash on different inference providers under streaming, single-user load
    - Measure serverless and shared endpoints only
  non_goals:
    - Measure reasoning quality
    - Measure high-concurrency throughput or saturation behavior
    - Measure multi-turn performance

dataset:
  source: data/micro-single-task
  manifest: data/micro-single-task/manifest.json
  available_items: 721
  selected_items: 600
  reuse_across_providers: true
  selection:
    method: deterministic_per_task_family_prefix
    selected_items_per_task_family: 200
    seed_inputs:
      - benchmark.slug
      - dataset release hash
      - task family
      - schedule algorithm version
    persist_selected_ids_before_execution: true
  tokenizer:
    implementation: tiktoken
    encoding: o200k_base
    same_tokenizer_for_every_provider: true
    lock_implementation_version_and_vocabulary_hash: true
  task_families:
    meeting-notes-lookup:
      available_items: 237
      selected_items: 200
      input_tokens: 500-1000
      output_schema:
        answer: string
      prompt_template: prompt_templates/meeting-notes.system.txt
    ticket-triage:
      available_items: 244
      selected_items: 200
      input_tokens: 50-100
      output_schema:
        category: string
        priority: string
      prompt_template: prompt_templates/ticket-triage.system.txt
    contract-terms-extraction:
      available_items: 240
      selected_items: 200
      input_tokens: 500-1000
      output_schema:
        agreement_type: string
        effective_date: string
        initial_term_end_date: string
        auto_renews: boolean
        renewal_term_months: number | null
        non_renewal_notice_days: number | null
        payment_terms_days: number | null
        termination_for_convenience: boolean
        termination_notice_days: number | null
        security_incident_notice_hours: number | null
      prompt_template: prompt_templates/contract-terms.system.txt

