      model_key: glm-5.3-flash
      pricing_usd_per_million_tokens:
        input: 0.15
        output: 0.50
    together:
      docs: https://docs.together.ai/docs/inference/chat/overview
      api_key: TOGETHER_API_KEY
      model_key: zai-org/GLM-5.3-Flash
      pricing_usd_per_million_tokens:
        input: 0.15
        output: 0.50
    fireworks:
      docs: https://docs.fireworks.ai/api-reference/post-chatcompletions
      api_key: FIREWORKS_API_KEY
      model_key: accounts/fireworks/models/glm-5p3-flash
      pricing_usd_per_million_tokens:
        input: 0.15
        output: 0.50
    baseten:
      docs: https://docs.baseten.co/reference/inference-api/chat-completions
      api_key: BASETEN_API_KEY
      model_key: zai-org/GLM-5.3-Flash
      pricing_usd_per_million_tokens:
        input: 0.15
        output: 0.50
    telnyx:
      docs: https://developers.telnyx.com/api-reference/openai-chat/create-a-chat-completion-openai-compatible
      api_key: TELNYX_API_KEY
      model_key: zai-org/GLM-5.3-Flash
      pricing_usd_per_million_tokens:
        input: 0.15
        output: 0.50
    modal:
      proxy_token_id: MODAL_PROXY_TOKEN_ID
      proxy_token_secret: MODAL_PROXY_TOKEN_SECRET
      url: https://openfunnel--ep-glm-5-3-flash-server.us-west.modal.direct/v1/chat/completions
      model_key: zai-org/GLM-5.3-Flash
      pricing_usd_per_million_tokens:
